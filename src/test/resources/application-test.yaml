spring:
  main:
    banner-mode: off
  # Lets tests count SQL statements (no N+1); the per-session metrics log stays quiet.
  jpa:
    properties:
      hibernate:
        generate_statistics: true
  # Tests that exercise the worker point these at WireMock and GreenMail.
  http:
    serviceclient:
      calendar:
        base-url: http://localhost:9
      rooms:
        base-url: http://localhost:9
  mail:
    host: 127.0.0.1
    port: 9

appointments:
  security:
    booking-client-password: booking-test
    admin-password: admin-test
  # Tests that exercise the worker turn it on.
  outbox:
    enabled: false
  email:
    from: appointments@clinic.test

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn
