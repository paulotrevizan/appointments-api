# Defaults for running from the IDE against `docker compose up -d postgres wiremock mailpit`;
# docker-compose.yml sets the same variables to the container host names.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointments}
    username: ${DB_USERNAME:appointments}
    password: ${DB_PASSWORD:appointments}
  # WireMock simulates both systems.
  http:
    serviceclient:
      calendar:
        base-url: ${CALENDAR_BASE_URL:http://localhost:8089}
      rooms:
        base-url: ${ROOMS_BASE_URL:http://localhost:8089}
  # Mailpit catches every email.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

appointments:
  security:
    booking-client-password: booking-local
    admin-password: admin-local
    # Swagger UI and the OpenAPI document open without login; sign in with the Authorize button.
    public-api-docs: true
  seed:
    min-doctors-per-specialty: 3
    max-doctors-per-specialty: 5
    rooms: 10
    patients: 200
  email:
    from: appointments@clinic.local
