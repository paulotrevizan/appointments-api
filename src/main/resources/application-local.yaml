spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appointments
    username: appointments
    password: appointments
  # WireMock simulates both systems (docker-compose.yml).
  http:
    serviceclient:
      calendar:
        base-url: http://localhost:8089
      rooms:
        base-url: http://localhost:8089

appointments:
  security:
    booking-client-password: booking-local
    admin-password: admin-local
    # Swagger UI and the OpenAPI document open without login; sign in with the Authorize button.
    public-api-docs: true
  seed:
    min-doctors-per-specialty: 3
    max-doctors-per-specialty: 5
    rooms: 10
    patients: 200
