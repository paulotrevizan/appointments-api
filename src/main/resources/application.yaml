spring:
  application:
    name: appointments-api
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

appointments:
  booking:
    max-retries: 2
  security:
    booking-client-password: ${BOOKING_CLIENT_PASSWORD}
    admin-password: ${ADMIN_PASSWORD}
  outbox:
    worker:
      enabled: true
    poll-interval: 2s
    batch-size: 20
    lease: 30s
    max-attempts: 10
    backoff:
      initial: 5s
      multiplier: 2
      max: 10m
      jitter: 1s
  integration:
    calendar-base-url: ${CALENDAR_BASE_URL}
    room-base-url: ${ROOM_BASE_URL}
