spring:
  application:
    name: appointments-api
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

appointments:
  booking:
    slot-duration: 30m
  security:
    booking-client-password: ${BOOKING_CLIENT_PASSWORD}
    admin-password: ${ADMIN_PASSWORD}
