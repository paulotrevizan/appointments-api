spring:
  application:
    name: appointments-api
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Milliseconds a request waits for a connection; then it gets a 503 (HLD 12), not a 30 s hang.
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # External systems (HLD 7.3): one HTTP service client group each, every call bounded.
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
    serviceclient:
      calendar:
        base-url: ${CALENDAR_BASE_URL}
      rooms:
        base-url: ${ROOMS_BASE_URL}
  # Credentials and TLS via the standard spring.mail settings (e.g. SPRING_MAIL_USERNAME).
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    # JavaMail waits forever by default; every SMTP call is bounded like the HTTP ones (ms).
    properties:
      "[mail.smtp.connectiontimeout]": 2000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      # /actuator/health/liveness and /readiness. Liveness never checks dependencies: a database
      # outage must stop traffic (readiness), not restart the instance.
      probes:
        enabled: true
      show-components: when-authorized
      group:
        readiness:
          include: readinessState, db
  # D-001: the service stays healthy while an external system (here SMTP) is down; the outbox
  # absorbs the outage.
  health:
    mail:
      enabled: false

logging:
  pattern:
    # Plain-text logs (IDE, tests). The container logs JSON, where the MDC is a field (Dockerfile).
    correlation: "[%X{requestId:-}] "

appointments:
  booking:
    max-retries: 2
  security:
    booking-client-password: ${BOOKING_CLIENT_PASSWORD}
    admin-password: ${ADMIN_PASSWORD}
  outbox:
    enabled: true
    poll-interval: 2s
    batch-size: 20
    # Longer than connect + read timeout, so a slow call keeps its lease (HLD 6.2).
    lease: 30s
    max-attempts: 10
    initial-backoff: 5s
    max-backoff: 10m
    backoff-multiplier: 2
    backoff-jitter: 0.2
  email:
    from: ${EMAIL_FROM}
