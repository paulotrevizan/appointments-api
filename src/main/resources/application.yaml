spring:
  application:
    name: appointments-api
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

appointments:
  booking:
    max-retries: 2
  security:
    booking-client-password: ${BOOKING_CLIENT_PASSWORD}
    admin-password: ${ADMIN_PASSWORD}
  outbox:
    enabled: true
    poll-interval: 2s
    batch-size: 20
    # Longer than connect + read timeout, so a slow call keeps its lease (HLD 6.2).
    lease: 30s
    max-attempts: 10
    initial-backoff: 5s
    max-backoff: 10m
    backoff-multiplier: 2
    backoff-jitter: 0.2
  integration:
    calendar-base-url: ${CALENDAR_BASE_URL}
    rooms-base-url: ${ROOMS_BASE_URL}
    connect-timeout: 2s
    read-timeout: 5s
